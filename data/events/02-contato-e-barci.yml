  title: Minuta devolvida com marcas de revisão; metadados apontam Moraes às 23h04
  summary: >
    Em 15 de janeiro de 2024, Vorcaro devolveu a Viviane o contrato com marcas de revisão de
    Leonardo Palhares. Às 23h04, os metadados do Office 365 registram última modificação pelo
    perfil “Ministro Alexandre de Moraes”. No fim da tarde, Faria perguntou se Vorcaro “Respondeu
    a Vivi”; Vorcaro quis saber se Faria “fechou 3 anos”, e Faria disse que “foram 4 anos, mas
    pode fazer 3”. O escritório Barci confirmou ao Poder360 que o ministro acessou e editou o
    arquivo, atribuindo o ato a consulta de compliance sobre impedimentos no STF.
