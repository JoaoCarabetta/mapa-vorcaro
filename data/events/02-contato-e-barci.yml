- id: faria-compartilha-contato-moraes
  date: "2023-12-26"
  date_precision: day
  title: Fábio Faria compartilha o contato “Alexandre de Moraes BRASILIA”
  summary: >
    Em 26 de dezembro de 2023, às 11h43, Faria compartilhou com Vorcaro, pelo WhatsApp, os
    rótulos “Alexandre de Moraes BRASILIA”, “Novo”, “STF TSE NOVO” e “Eu STF”, todos com o
    mesmo número. Vorcaro salvou “Alexandre de Moraes BRASILIA” na agenda no mesmo instante.
    Os dois combinavam a entrada “na garagem” no “mesmo esquema” do encontro de 21 de dezembro.
    Uma hora após a chegada, Faria fez o compartilhamento.
  notes: >
    Rótulo de agenda não é perícia de chip. A PF descreve o que estava salvo no aparelho de Vorcaro,
    não a titularidade cadastral da linha.
