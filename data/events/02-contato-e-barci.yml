- id: careca-nao-pode-atrasar
  date: "2024-03-15"
  date_precision: day
  title: “O careca não pode atrasar” — Vorcaro manda pagar “do jeito que for”
  summary: >
    Em 15 de março de 2024, Faria enviou um print e escreveu “O careca não pode atrasar”.
    Vorcaro cobrou Angelo Silva (“contrato mais importante que temos. Te pedi pra nao falhar.
    Surreal. Vamos ter problemas. Manda pagar agora”) e disse a Romy que o pagamento a Barci
    não podia “atrasar um dia”, que era o “pgto mais importante”, que podia “pagar sempre, sem
    nota” e “Do jeito que for”. Romy reenviou comprovante de R$ 3.422.268,14. Angelo falou em
    pagar antecipado e depois pegar a NF. O escritório afirmou que prestou os serviços e que
    Moraes foi consultado só sobre impedimentos legais.
  people:
    - { name: Daniel Bueno Vorcaro, id: daniel-bueno-vorcaro }
