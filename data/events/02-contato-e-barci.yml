  date_precision: day
  title: Vorcaro e Angelo Silva assinam o contrato Master–Barci
  summary: >
    A PF registra assinatura digital de Daniel Bueno Vorcaro em 23 de janeiro de 2024, às 15h15,
    e de Angelo Antonio Ribeiro da Silva às 15h35. O instrumento previa 36 parcelas de R$ 3 milhões
    líquidos (cerca de R$ 108 milhões) ou R$ 131,3 milhões brutos em três anos, por advocacia,
    consultoria e compliance. Viviane, fora do Brasil, pediu vias físicas lacradas a Guilherme
    Benazzi. O Poder360 também cita a data de 16 de janeiro no corpo do documento; as assinaturas
