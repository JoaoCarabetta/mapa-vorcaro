- id: encontro-tucuma-21-dez-2023
  date: "2023-12-21"
  date_precision: day
  title: Fábio Faria pede placa do carro para “autorizar a segurança”
  summary: >
    Em 21 de dezembro de 2023, Fábio Faria pediu a Vorcaro modelo e placa do veículo para
    “autorizar a segurança a acompanhar na garagem”. Vorcaro perguntou “Chego 11 cravado?”,
    enviou os dados de um Range Rover Vogue e mandou o motorista ao endereço “Tucumã 99”.
    Depois do encontro, Faria enviou um áudio dizendo que o interlocutor “gostei da conversa”
    e queria remarcar “já logo na terça-feira”, e citou “um almoço com o Alexandre no CADE”.
  notes: >
    A PF não afirma, neste trecho, perícia de que o anfitrião da garagem seja Alexandre de Moraes.
    O áudio de Faria menciona “Alexandre” em outro compromisso (almoço no Cade), não como identificação
    forense do encontro.
  people:
    - { name: Daniel Bueno Vorcaro, id: daniel-bueno-vorcaro }
    - { name: Fábio Faria, id: fabio-faria, role: intermediário }
  tags: [whatsapp, encontro, fabio-faria, stf]
