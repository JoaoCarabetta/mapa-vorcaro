- id: compliance-zero-liquidacao
  date: "2025-11-18"
  date_precision: day
  title: Operação Compliance Zero e liquidação extrajudicial do Master
  summary: >
    Em 18 de novembro de 2025 a PF deflagrou a Compliance Zero — cinco preventivas, duas
    temporárias, 25 buscas — sobre emissão de títulos de crédito falsos, gestão fraudulenta
    e organização criminosa. O relatório da PF estima cerca de R$ 12 bilhões em carteiras
    cedidas ao BRB. No mesmo dia o Banco Central, em atos de Gabriel Galípolo, decretou a
    liquidação extrajudicial do Banco Master e da corretora, nomeou liquidante e tornou
    indisponíveis bens de Vorcaro, Gallo Neto, Simonsen, Luiz Antonio Bull e Angelo Silva.
    Paulo Henrique Costa e Dario Garcia Júnior foram afastados do BRB. Parte da imprensa
    data a “1ª fase” no dia 18; a prisão de Vorcaro ocorrera na véspera.
  people:
