- id: prisao-guarulhos-17-nov
  date: "2025-11-17"
  date_precision: day
  title: PF prende Vorcaro no aeroporto de Guarulhos
  summary: >
    Na noite de 17 de novembro de 2025, a Polícia Federal prendeu Daniel Vorcaro no Aeroporto
    Internacional de Guarulhos, na aviação executiva. Investigadores falaram em jato particular
    com destino a Malta; a defesa negou fuga e afirmou reunião em Dubai com compradores.
    A operação formal, Compliance Zero, estava prevista para a manhã do dia 18 e foi antecipada.
    A prisão foi decretada pela 10ª Vara Federal Criminal do DF. O celular Apple apreendido
    nessa busca pessoal é a fonte da IPJ-A 3298613/2026.
