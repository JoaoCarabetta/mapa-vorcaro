- id: mensagens-15-nov-fora-do-pais
  date: "2025-11-15"
  date_precision: day
  title: “Acha que 2ª já tenho que estar fora?”
  summary: >
    Em 15 de novembro de 2025, sábado, Vorcaro perguntou ao contato de agenda se um encontro
    estava marcado, pediu nova conversa e escreveu “Acha que 2ª já tenho que estar fora?”.
    Depois de uma resposta não recuperada, reagiu “Que loucura, bem na semana que estou
    resolvendo tudo” e perguntou “Aquele mesmo juiz Ricardo? E o Galípolo tá sabendo?
    Conseguimos fazer algo?”. Em outro trecho reproduzido pelo Valor: “Não conseguimos
    reverter isso com Paulo ou Andrei? Muita sacanagem isso”. Também disse que a defesa
    cogitava petições para saber de inquéritos e que “Não vou fazer nenhum movimento que
    você não ache produtivo. Estamos no escuro.”
  notes: >
    Visualização única. A PF não recuperou o teor das respostas. A menção ao juiz Ricardo
    indica conhecimento de autos que ainda não eram públicos.
