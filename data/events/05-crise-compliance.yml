  summary: >
    Em 30 de outubro de 2025, Vorcaro redigiu no app Notas que tivera “informações informais
    e em confidencia de turma do banco central, que G e os diretores estao na pressao máxima
    de novo pra uma medida, pois o bacen esta sendo muito pressionado pela PF e MP”. Pediu
    “reforçar com Andrei e Paulo pra nao deixar ninguem de baixo fazer uma sacanagem” e
    prometeu enviar “os nomes que tem ido ao Bacen”. Segundos depois de cada screenshot,
    o WhatsApp registra envio ao terminal da agenda “Alexandre de Moraes BRASILIA”. A PF
