  title: Máxima é rebatizado como Banco Master
  summary: >
    Em 2021 o Máxima passou a se chamar Banco Master, banco múltiplo com ênfase em crédito
    consignado no Norte e no Nordeste. O Valor atribui a sugestão do novo nome ao filho de Vorcaro.
    Naquele ano o banqueiro falava em cerca de 500 mil clientes.
