- id: maxima-acordo-controle-2017
  date: "2017-01-01"
  date_precision: year
  title: Acordo para assumir o controle do Máxima
  summary: >
    Vorcaro acertou, em 2017, a assunção do controle do Máxima com a promessa de injetar
    mais de R$ 75 milhões, a partir de um aporte inicial de R$ 25 milhões. O Valor registra
    que a fatia de controle só seria formalmente aprovada pelo Banco Central dois anos depois.
