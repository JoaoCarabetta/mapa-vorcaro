  date: "2025-04-01"
  date_precision: month
  title: Master anuncia lucro de R$ 1,068 bilhão em 2024
  summary: >
    Em abril de 2025 o banco divulgou lucro líquido de R$ 1,068 bilhão em 2024, patrimônio
    de R$ 4,74 bilhões, ativos de crédito de R$ 40,31 bilhões e ROE de 28,5%, números que
