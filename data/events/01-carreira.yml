- id: maxima-participacao-minoritaria
  date: "2016-01-01"
  date_precision: year
  title: Vorcaro entra no Banco Máxima com fatia minoritária
  summary: >
    Daniel Bueno Vorcaro, até então ligado ao grupo imobiliário Multipar, em Belo Horizonte,
    adquiriu participação minoritária no Banco Máxima, então associado à família Sabbá.
    A Bloomberg Línea e o Valor descrevem o movimento como a porta de entrada do empresário
    no sistema financeiro, depois de negócios em fundos imobiliários.
