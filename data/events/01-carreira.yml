- id: modelo-cdb-fgc
  date: "2023-12-01"
  date_precision: month
  title: Mudanças regulatórias expõem o modelo de CDBs do Master
  summary: >
    A Bloomberg Línea situa no fim de 2023 o momento em que alterações regulatórias do Banco
    Central tornaram visíveis fragilidades do Master — captação via CDBs com garantia do FGC
    e alocação em ativos de risco, como precatórios. A BBC descreve taxas perto de 140% do CDI,
    acima do padrão de pares.
