- id: ciro-gonet-e-firme
  date: "2024-04-14"
  date_precision: day
  title: Ciro Soares — “Gonet é firme” e áudio sobre desistência de Jarbas
  summary: >
    Em 14 de abril de 2024, Ciro Soares escreveu a Vorcaro “Amizade é tudo viu irmão” e
    “Gonet é firme”, pedindo que lesse um encaminhamento “Fique só com vc”. No áudio,
    Ciro narra ter pedido a Gonet que intercedesse para “o cara” desistir de uma candidatura
    ligada a Jarbas; segundo Ciro, Gonet ligou de volta e disse que a pessoa desistiria.
    Não há contato “Paulo Gonet” na agenda extraída do celular de Vorcaro.
  notes: >
    O conteúdo chega a Vorcaro por reenvio. A PF não extraiu o telefone de Gonet no aparelho.
  people:
    - { name: Daniel Bueno Vorcaro, id: daniel-bueno-vorcaro }
    - { name: Ciro Soares, id: ciro-soares, role: intermediário }
    - { name: Paulo Gonet Branco, id: paulo-gonet, role: citado no reenvio }
  tags: [pgr, whatsapp, ciro-soares]
  sources:
    - url: https://static.poder360.com.br/uploads/2026/09/pet16662_relatorio_pf_celular_vorcaro_moraes_gonet_andrei_barci.pdf
      publisher: Polícia Federal / Poder360
      title: IPJ-A 3298613/2026
      accessed: "2026-09-05"
      quote: "Cara, eu pedi o Gonet ontem, ele me ligou falar um assunto, aí eu falei, Gonet, pede o cara para tirar a candidatura"
  evidence_type: primary_document
  confidence: medium

- id: convite-andrei-londres
