  summary: >
    Em 3 de abril de 2024, Faria encaminhou a Vorcaro mensagens de terceiro sobre “convidar
    o DPF Andrei” para “fecharmos o PGR e o DPF”. Faria respondeu “Acho ótimo” / “Pode convidar”.
    Minutos depois veio a confirmação “Ele aceitou”. Vorcaro disse a “Marcio Conjur” que o
    “Ministro fez convite ao andrei PF”. A assistente do diretor-geral perguntou se hospedagem
