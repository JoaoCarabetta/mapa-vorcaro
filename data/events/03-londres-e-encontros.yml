- id: macallan-george-club
  date: "2024-04-25"
  date_precision: day
  title: Degustação de Macallan no George Club, em Mayfair
  summary: >
    Em 25 de abril de 2024, no George Club, houve degustação de whisky Macallan custeada em
    US$ 640.831,88, segundo documentos da organização. O Poder360 lista entre os presentes
    Moraes, Vorcaro, Andrei Rodrigues, Gonet, Toffoli, Lewandowski, Hugo Motta, Benedito
    Gonçalves e Ciro Soares. Em sessão fechada do STF de 12 de fevereiro de 2026, Moraes
    disse: “Eu estava lá. Andrei Rodrigues estava lá. Depois fomos todos juntos a um pub,
    tomamos Macallan”. Vorcaro escreveu a Martha Graeff: “Todos os ministros do Brasil,
    do STF, STJ etc. E euzinho discursando”.
