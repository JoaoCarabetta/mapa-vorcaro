  date_precision: day
  title: Fachin abre a PET 16.704 e pede explicações em cinco dias
  summary: >
    Em 3 de setembro de 2026 o presidente do STF, Edson Fachin, instaurou de ofício a PET 16.704.
    Deu prazo comum de cinco dias úteis a Alexandre de Moraes, André Mendonça, Paulo Gonet e
    Andrei Rodrigues para informar sobre LOMAN, uso de credenciais institucionais, eventual
    revelação de sigilo a investigado e o despacho que mandou identificar as pessoas das
