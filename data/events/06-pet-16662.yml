- id: pet-15556-72-horas
  date: "2026-08-24"
  date_precision: day
  title: Mendonça dá 72 horas para a PF identificar a rede de influência
  summary: >
    Na PET 15.556, André Mendonça determinou que a PF apresentasse, em 72 horas, a identificação
    das pessoas das mensagens das fls. 3-5 da IPJ-M 144738439.2026, inclusive detentores de foro.
    A PGR diria depois que o ato data de 24 de agosto de 2026 e que o relator “já sabia” que
    Moraes estava entre os nomes. A PF ressalva que não aprofundou diligências contra magistrados,
    limitando-se ao material já apreendido, e que a análise “não possui caráter exaustivo”.
