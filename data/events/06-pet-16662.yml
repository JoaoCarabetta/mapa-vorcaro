- id: pgr-pede-nulidade-relatorio
  date: "2026-09-01"
  date_precision: day
  title: Gonet pede a nulidade do relatório da PF
  summary: >
    Na manifestação à PET 16.662, o procurador-geral Paulo Gonet — ele próprio citado no
    relatório — pediu a nulidade da peça. Argumentou que “não cabe a juiz investigar”, que
    Mendonça não tinha competência para dirigir ações policiais contra alvos de foro e que
    o relator impôs uma investigação sobre Moraes. Quase 190 das 218 páginas, disse, tratam
    do ministro. Mendonça deu cinco dias de vista à PGR e, ainda assim, mandou o material
    ao plenário.
