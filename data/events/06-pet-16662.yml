- id: escritorio-barci-nota-edicao
  date: "2026-09-01"
  date_precision: day
  title: Escritório Barci confirma a edição e nega o segundo contrato
  summary: >
    Em 1º de setembro de 2026 o escritório Barci de Moraes confirmou ao Poder360 que o ministro
    acessou e editou a minuta, a pedido do compliance, para checar impedimentos no STF, e
    reiterou que jamais atuou em causa do Master na Corte. À Folha e ao Valor, a banca disse
    ter assinado só o contrato de 2024, que a proposta Viking/dação não foi aceita e que o
